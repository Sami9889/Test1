# Copyright © 2025 FERROWORKS.
# Do not remove or alter this notice. Unauthorized tampering may violate applicable law or license terms.
# GitHub Actions must read this workflow as plaintext; each revision is also preserved as an authenticated
# encrypted FWENC004 snapshot in .github/encrypted-backups after a successful Pages deployment.
name: FERROWORKS Pages decrypt and deploy

on:
  workflow_run:
    workflows:
      - FERROWORKS encrypted recovery
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ferroworks-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Decrypt, build, deploy, then encrypt source
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
         github.ref_name == github.event.repository.default_branch) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install pinned cryptography library
        run: python3 -m pip install --disable-pip-version-check --no-warn-script-location cryptography==50.0.2

      - name: Install pinned static-asset transformers
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/fw-asset-tools" --no-save --no-package-lock javascript-obfuscator@5.9.0 html-minifier-terser@7.2.0

      - name: Prepare the embedded encryption helper
        shell: bash
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/fwenc.py"
          umask 077
          cat > "$helper" <<'PYTHON'
          import argparse
          import base64
          import hashlib
          import json
          import os
          import secrets
          import stat
          import struct
          import sys
          import tempfile
          from pathlib import Path

          from cryptography.exceptions import InvalidTag
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding, rsa
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          MAGIC = b"FWENC004"
          MAX_FILE = 512 * 1024 * 1024
          MAX_HEADER = 16 * 1024
          MAX_RECIPIENTS = 32
          OAEP = padding.OAEP(
              mgf=padding.MGF1(algorithm=hashes.SHA256()),
              algorithm=hashes.SHA256(),
              label=b"FERROWORKS-FWENC004",
          )

          def fail(message):
              raise ValueError(message)

          def read_limited(path):
              size = path.stat().st_size
              if size > MAX_FILE:
                  fail(f"Refusing file larger than {MAX_FILE} bytes: {path}")
              data = path.read_bytes()
              if len(data) > MAX_FILE:
                  fail(f"Refusing file larger than {MAX_FILE} bytes: {path}")
              return data

          def public_key_id(public_key):
              der = public_key.public_bytes(
                  serialization.Encoding.DER,
                  serialization.PublicFormat.SubjectPublicKeyInfo,
              )
              return hashlib.sha256(der).hexdigest()

          def check_rsa(key):
              if not isinstance(key, rsa.RSAPublicKey) and not isinstance(key, rsa.RSAPrivateKey):
                  fail("FWENC004 requires RSA keys; provide a PEM RSA key pair.")
              if key.key_size < 3072 or key.key_size > 8192:
                  fail("RSA keys must be between 3072 and 8192 bits.")

          def b64decode(value, label):
              if not isinstance(value, str):
                  fail(f"Invalid {label} encoding.")
              try:
                  return base64.b64decode(value, validate=True)
              except (ValueError, base64.binascii.Error):
                  fail(f"Invalid {label} encoding.")

          def atomic_write(destination, data):
              destination = Path(destination)
              destination.parent.mkdir(parents=True, exist_ok=True)
              fd, temporary_name = tempfile.mkstemp(prefix=".fwenc-", dir=destination.parent)
              temporary = Path(temporary_name)
              try:
                  with os.fdopen(fd, "wb") as stream:
                      os.fchmod(stream.fileno(), 0o600)
                      stream.write(data)
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(temporary, destination)
              finally:
                  temporary.unlink(missing_ok=True)

          def encrypt(args):
              source = Path(args.input)
              destination = Path(args.output)
              plaintext = read_limited(source)
              if not args.public_key:
                  fail("At least one --public-key is required.")
              if len(args.public_key) > MAX_RECIPIENTS:
                  fail(f"At most {MAX_RECIPIENTS} recipient keys are supported.")

              recipient_keys = {}
              for key_path in args.public_key:
                  public_key = serialization.load_pem_public_key(Path(key_path).read_bytes())
                  check_rsa(public_key)
                  recipient_keys[public_key_id(public_key)] = public_key

              # Use one random content key and wrap it independently for every recipient.
              content_key = secrets.token_bytes(32)
              wrapped_recipients = []
              for key_id, public_key in sorted(recipient_keys.items()):
                  wrapped_recipients.append({
                      "kid": key_id,
                      "wrapped": base64.b64encode(public_key.encrypt(content_key, OAEP)).decode("ascii"),
                  })
              header = {
                  "alg": "RSA-OAEP-SHA256+A256GCM",
                  "nonce": base64.b64encode(secrets.token_bytes(12)).decode("ascii"),
                  "recipients": wrapped_recipients,
                  "v": 4,
              }
              header_bytes = json.dumps(header, sort_keys=True, separators=(",", ":")).encode("ascii")
              if len(header_bytes) > MAX_HEADER:
                  fail("Encryption header exceeds the allowed size.")
              prefix = MAGIC + struct.pack(">I", len(header_bytes)) + header_bytes
              ciphertext = AESGCM(content_key).encrypt(
                  base64.b64decode(header["nonce"]), plaintext, prefix
              )
              atomic_write(destination, prefix + ciphertext)

          def reject_duplicate_fields(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      fail("Duplicate encryption header field.")
                  result[key] = value
              return result

          def decrypt(args):
              source = Path(args.input)
              blob = read_limited(source)
              if len(blob) < 12 or blob[:8] != MAGIC:
                  if blob[:8] == b"FWENC003":
                      fail("Legacy FWENC003 files are not supported by this workflow. Restore trusted plaintext and re-encrypt with FWENC004 before deploying.")
                  fail("Unsupported or invalid encrypted file format (expected FWENC004).")
              header_size = struct.unpack(">I", blob[8:12])[0]
              if header_size == 0 or header_size > MAX_HEADER or 12 + header_size + 16 > len(blob):
                  fail("Invalid or truncated encryption header.")
              header_bytes = blob[12:12 + header_size]
              try:
                  header = json.loads(header_bytes, object_pairs_hook=reject_duplicate_fields)
              except (UnicodeDecodeError, json.JSONDecodeError):
                  fail("Invalid encryption header.")
              if not isinstance(header, dict) or set(header) != {"alg", "nonce", "recipients", "v"}:
                  fail("Invalid encryption header fields.")
              if header["v"] != 4 or header["alg"] != "RSA-OAEP-SHA256+A256GCM":
                  fail("Unsupported encryption version or algorithm.")
              nonce = b64decode(header["nonce"], "nonce")
              if len(nonce) != 12:
                  fail("Invalid AES-GCM nonce length.")
              recipients = header["recipients"]
              if not isinstance(recipients, list) or not 1 <= len(recipients) <= MAX_RECIPIENTS:
                  fail("Invalid recipient list.")
              if args.passphrase_file:
                  passphrase = Path(args.passphrase_file).read_bytes().rstrip(b"\r\n") or None
              else:
                  passphrase = None
              private_key = serialization.load_pem_private_key(
                  Path(args.private_key).read_bytes(), password=passphrase
              )
              check_rsa(private_key)
              wanted_id = public_key_id(private_key.public_key())
              wrapped_key = None
              for recipient in recipients:
                  if not isinstance(recipient, dict) or set(recipient) != {"kid", "wrapped"}:
                      fail("Invalid recipient entry.")
                  kid = recipient["kid"]
                  if not isinstance(kid, str) or len(kid) != 64:
                      fail("Invalid recipient key identifier.")
                  if kid == wanted_id:
                      wrapped_key = b64decode(recipient["wrapped"], "wrapped key")
                      break
              if wrapped_key is None:
                  fail("This private key is not an encryption recipient.")
              try:
                  content_key = private_key.decrypt(wrapped_key, OAEP)
                  if len(content_key) != 32:
                      fail("Invalid content encryption key.")
                  plaintext = AESGCM(content_key).decrypt(
                      nonce, blob[12 + header_size:], blob[:12 + header_size]
                  )
              except (ValueError, InvalidTag):
                  fail("Decryption or authentication failed; ciphertext may be corrupted or tampered with.")
              if len(plaintext) > MAX_FILE:
                  fail("Decrypted file exceeds the allowed size.")
              atomic_write(args.output, plaintext)

          def main():
              parser = argparse.ArgumentParser(description="FERROWORKS authenticated hybrid file encryption")
              subparsers = parser.add_subparsers(dest="command", required=True)
              enc = subparsers.add_parser("encrypt")
              enc.add_argument("--input", required=True)
              enc.add_argument("--output", required=True)
              enc.add_argument("--public-key", action="append", default=[])
              dec = subparsers.add_parser("decrypt")
              dec.add_argument("--input", required=True)
              dec.add_argument("--output", required=True)
              dec.add_argument("--private-key", required=True)
              dec.add_argument("--passphrase-file")
              args = parser.parse_args()
              try:
                  (encrypt if args.command == "encrypt" else decrypt)(args)
              except Exception as error:
                  print(f"FWENC: {error}", file=sys.stderr)
                  raise SystemExit(1)

          if __name__ == "__main__":
              main()
          PYTHON
          chmod 0700 "$helper"
          echo "FWENC_HELPER=$helper" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Calculate the Vite base path
        id: pages-path
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [[ "${repository,,}" == "${owner,,}.github.io" ]]; then
            base_path="/"
          else
            base_path="/${repository}/"
          fi
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"

      - name: Decrypt app files in a temporary build copy
        shell: bash
        env:
          BACKUP_DECRYPT_PRIVATE_KEY: ${{ secrets.BACKUP_DECRYPT_PRIVATE_KEY }}
          BACKUP_DECRYPT_PASSPHRASE: ${{ secrets.BACKUP_DECRYPT_PASSPHRASE }}
        run: |
          set -euo pipefail
          source_copy="$RUNNER_TEMP/ferroworks-pages-source"
          app="$source_copy/artifacts/production"
          rm -rf -- "$source_copy"
          mkdir -m 0700 "$source_copy"
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='**/node_modules/' \
            --exclude='dist/' \
            --exclude='**/dist/' \
            --exclude='.cache/' \
            --exclude='attached_assets/' \
            --exclude='.github/encrypted-backups/' \
            "$GITHUB_WORKSPACE/" "$source_copy/"
          test -d "$app" || { echo "Expected app directory is missing: artifacts/production" >&2; exit 1; }
          echo "PAGES_SOURCE_COPY=$source_copy" >> "$GITHUB_ENV"
          python3 - "$app" "$FWENC_HELPER" "$RUNNER_TEMP" <<'PYDECRYPT'
          import os
          import stat
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          app, helper, temp_root = map(Path, sys.argv[1:])
          encrypted = []
          for path in sorted(app.rglob("*")):
              if path.is_file() and not path.is_symlink():
                  with path.open("rb") as stream:
                      if stream.read(8) in {b"FWENC003", b"FWENC004"}:
                          encrypted.append(path)
          if not encrypted:
              print("No encrypted app files found in the isolated build copy.")
              raise SystemExit(0)

          private_text = os.environ.get("BACKUP_DECRYPT_PRIVATE_KEY", "")
          if not private_text:
              raise SystemExit("Encrypted app files exist. Configure BACKUP_DECRYPT_PRIVATE_KEY.")
          work = Path(tempfile.mkdtemp(prefix="fw-pages-decrypt-", dir=temp_root))
          os.chmod(work, 0o700)
          staged = work / "staged"
          staged.mkdir(mode=0o700)
          private_key = work / "private.pem"
          passphrase_file = work / "passphrase.txt"
          private_key.write_text(private_text, encoding="utf-8")
          passphrase_file.write_text(os.environ.get("BACKUP_DECRYPT_PASSPHRASE", "").rstrip("\r\n"), encoding="utf-8")
          os.chmod(private_key, 0o600)
          os.chmod(passphrase_file, 0o600)
          try:
              for encrypted_path in encrypted:
                  relative = encrypted_path.relative_to(app)
                  destination = staged / relative
                  destination.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                  subprocess.run([
                      sys.executable, str(helper), "decrypt",
                      "--private-key", str(private_key),
                      "--passphrase-file", str(passphrase_file),
                      "--input", str(encrypted_path), "--output", str(destination),
                  ], check=True)
                  os.chmod(destination, stat.S_IMODE(encrypted_path.stat().st_mode))
              for encrypted_path in encrypted:
                  relative = encrypted_path.relative_to(app)
                  os.replace(staged / relative, encrypted_path)
          finally:
              for path in sorted(work.rglob("*"), reverse=True):
                  if path.is_file() or path.is_symlink():
                      path.unlink(missing_ok=True)
                  elif path.is_dir():
                      path.rmdir()
              work.rmdir()
          print(f"Decrypted {len(encrypted)} app file(s) in the isolated build copy.")
          PYDECRYPT

      - name: Add copyright notices to comment-capable app files
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PAGES_SOURCE_COPY/artifacts/production" <<'PYCOPYRIGHT'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          marker = "Copyright © 2025 FERROWORKS."
          block = """/*!
           * Copyright © 2025 FERROWORKS.
           * Do not alter, remove, or misrepresent this notice or the integrity manifest.
           * Unauthorized tampering may violate applicable license terms or law.
           * Third-party materials retain their respective copyrights and licenses.
           */
          """
          html = """<!--
          Copyright © 2025 FERROWORKS.
          Do not alter, remove, or misrepresent this notice or the integrity manifest.
          Unauthorized tampering may violate applicable license terms or law.
          Third-party materials retain their respective copyrights and licenses.
          -->
          """
          hash_comment = """# Copyright © 2025 FERROWORKS.
          # Do not alter, remove, or misrepresent this notice or the integrity manifest.
          # Unauthorized tampering may violate applicable license terms or law.
          # Third-party materials retain their respective copyrights and licenses.
          """

          for path in root.rglob("*"):
              if not path.is_file() or path.is_symlink():
                  continue
              suffix = path.suffix.lower()
              if suffix in {".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".css"}:
                  text = path.read_text(encoding="utf-8")
                  if marker not in text[:1024]:
                      path.write_text(block + text, encoding="utf-8")
              elif suffix == ".html":
                  text = path.read_text(encoding="utf-8")
                  if marker not in text[:1024]:
                      match = re.search(r"<!doctype\s+html[^>]*>", text, flags=re.IGNORECASE)
                      if match:
                          text = text[:match.end()] + "\n" + html + text[match.end():]
                      else:
                          text = html + text
                      path.write_text(text, encoding="utf-8")
              elif suffix in {".yaml", ".yml", ".toml", ".sh"}:
                  text = path.read_text(encoding="utf-8")
                  if marker not in text[:1024]:
                      if suffix == ".sh" and text.startswith("#!"):
                          first_line, rest = text.split("\n", 1)
                          text = first_line + "\n" + hash_comment + rest
                      else:
                          text = hash_comment + text
                      path.write_text(text, encoding="utf-8")
          print("Added notices where the file format supports comments.")
          PYCOPYRIGHT

      - name: Install workspace dependencies
        working-directory: ${{ runner.temp }}/ferroworks-pages-source
        run: pnpm install --frozen-lockfile

      - name: Build the Vite site
        working-directory: ${{ runner.temp }}/ferroworks-pages-source
        env:
          PORT: "8081"
          BASE_PATH: ${{ steps.pages-path.outputs.base_path }}
        run: pnpm --filter @workspace/production run build

      - name: Minify and obfuscate published assets
        shell: bash
        run: |
          set -euo pipefail
          dist="$PAGES_SOURCE_COPY/artifacts/production/dist"
          test -f "$dist/index.html"
          node "$RUNNER_TEMP/fw-asset-tools/node_modules/html-minifier-terser/cli.js" \
            --collapse-whitespace --remove-comments --remove-optional-tags \
            --remove-redundant-attributes --remove-script-type-attributes \
            --remove-style-link-type-attributes --use-short-doctype --minify-css true \
            --minify-js true "$dist/index.html" -o "$RUNNER_TEMP/fw-index.min.html"
          mv -- "$RUNNER_TEMP/fw-index.min.html" "$dist/index.html"
          # Source maps preserve the original source, defeating obfuscation; remove maps and their trailers.
          find "$dist" -type f -name '*.map' -delete
          mapfile -d '' assets < <(find "$dist" -type f \( -iname '*.js' -o -iname '*.mjs' -o -iname '*.css' \) -print0)
          js_count=0
          if ((${#assets[@]})); then
            node - "$RUNNER_TEMP/fw-asset-tools/node_modules/javascript-obfuscator" "${assets[@]}" <<'JSOBFUSCATE'
          const fs = require('node:fs');
          const Obfuscator = require(process.argv[2]);
          const files = process.argv.slice(3);
          const stripSourceMap = source => source.replace(/(?:\/\/[#@]\s*sourceMappingURL=.*?$|\/\*[#@]\s*sourceMappingURL=.*?\*\/)/gm, '');
          let jsCount = 0;
          for (const file of files) {
            const source = stripSourceMap(fs.readFileSync(file, 'utf8'));
            if (/\.m?js$/i.test(file)) {
              const result = Obfuscator.obfuscate(source, {
                compact: true,
                target: 'browser',
                ignoreImports: true,
                identifierNamesGenerator: 'hexadecimal',
                renameGlobals: false,
                renameProperties: false,
                selfDefending: false,
                simplify: true,
                splitStrings: true,
                splitStringsChunkLength: 8,
                stringArray: true,
                stringArrayCallsTransform: false,
                stringArrayEncoding: ['base64'],
                stringArrayRotate: true,
                stringArrayShuffle: true,
                stringArrayThreshold: 0.6,
                transformObjectKeys: false,
                unicodeEscapeSequence: false
              });
              fs.writeFileSync(file, result.getObfuscatedCode(), { mode: fs.statSync(file).mode });
              jsCount++;
            } else {
              fs.writeFileSync(file, source, { mode: fs.statSync(file).mode });
            }
          }
          console.log(`Obfuscated ${jsCount} JavaScript bundle(s) and stripped source-map links.`);
          if (process.env.GITHUB_OUTPUT) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `javascript_bundles_obfuscated=${jsCount}\\n`);
          }
          JSOBFUSCATE
          fi
          echo "Minified the HTML and obfuscated JavaScript bundles for delivery."

      - name: Add Pages fallback, copyright notice, and file integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          dist="$PAGES_SOURCE_COPY/artifacts/production/dist"
          test -f "$dist/index.html"
          cp -- "$dist/index.html" "$dist/404.html"
          cat > "$dist/COPYRIGHT.txt" <<'COPYRIGHT'
          Copyright © 2025 FERROWORKS.
          Do not alter, remove, or misrepresent this notice or the integrity manifest.
          Unauthorized tampering may violate applicable license terms or law.
          This notice does not replace or modify any license or notice in this repository.
          Third-party materials retain their respective copyrights and licenses.
          COPYRIGHT
          python3 - "$dist" <<'PYMANIFEST'
          import hashlib
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest = root / "COPYRIGHT-MANIFEST.tsv"
          rows = [
              "Copyright © 2025 FERROWORKS.",
              "Do not alter, remove, or misrepresent this notice or the integrity manifest.",
              "Unauthorized tampering may violate applicable license terms or law.",
              "SHA-256\tFILE",
          ]
          files = sorted(path for path in root.rglob("*") if path.is_file() and path != manifest)
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append(f"{digest}\t{path.relative_to(root).as_posix()}")
          manifest.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PYMANIFEST

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/ferroworks-pages-source/artifacts/production/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Encrypt app source after successful deployment
        shell: bash
        env:
          BACKUP_RECIPIENT_PUBLIC_KEY: ${{ vars.BACKUP_RECIPIENT_PUBLIC_KEY || secrets.BACKUP_RECIPIENT_PUBLIC_KEY }}
          BACKUP_DECRYPT_PRIVATE_KEY: ${{ secrets.BACKUP_DECRYPT_PRIVATE_KEY }}
          BACKUP_DECRYPT_PASSPHRASE: ${{ secrets.BACKUP_DECRYPT_PASSPHRASE }}
          BACKUP_ENCRYPT_WORKFLOW: "false"
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE" "$PAGES_SOURCE_COPY" "$FWENC_HELPER" "$RUNNER_TEMP" <<'PYENCRYPT'
          import os
          import stat
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          workspace, source_copy, helper, temp_root = map(Path, sys.argv[1:])
          site_rel = Path("artifacts/production")
          site_root = workspace / site_rel
          source_root = source_copy / site_rel

          def should_encrypt(rel):
              lower = [part.lower() for part in rel.parts]
              if any(part in {"node_modules", "dist"} for part in lower):
                  return False
              if ".replit-artifact" in lower:
                  return False
              if rel.suffix.lower() in {".md", ".markdown"}:
                  return False
              if rel.name.lower().startswith("readme"):
                  return False
              return True

          tracked = subprocess.run(
              ["git", "ls-files", "-z", "--", site_rel.as_posix()],
              cwd=workspace, check=True, capture_output=True,
          ).stdout.split(b"\0")
          candidates = []
          for item in tracked:
              if not item:
                  continue
              rel = Path(os.fsdecode(item))
              if not should_encrypt(rel.relative_to(site_rel)):
                  continue
              target = workspace / rel
              if not target.is_file() or target.is_symlink():
                  continue
              with target.open("rb") as stream:
                  signature = stream.read(8)
              if signature in {b"FWENC003", b"FWENC004"}:
                  continue
              source = source_copy / rel
              if not source.is_file() or source.is_symlink():
                  raise SystemExit(f"Decrypted build copy is missing tracked file: {rel}")
              candidates.append((rel, target, source))

          workflow_source = workspace / ".github" / "workflows" / "ferroworks-encrypted-recovery.yaml"
          if not workflow_source.is_file() or workflow_source.is_symlink():
              raise SystemExit("The active workflow source is missing or is not a regular file.")
          workflow_snapshot_source = source_copy / ".github" / "workflows" / "ferroworks-encrypted-recovery.yaml"
          workflow_snapshot_enabled = os.environ.get("BACKUP_ENCRYPT_WORKFLOW", "false").lower() == "true"
          if workflow_snapshot_enabled and not workflow_snapshot_source.is_file():
              raise SystemExit("Workflow self-encryption was enabled but the isolated workflow snapshot is missing.")
          workflow_digest = __import__("hashlib").sha256(workflow_source.read_bytes()).hexdigest()
          workflow_backup = workspace / ".github" / "encrypted-backups" / f"workflow-{workflow_digest}.fwenc"
          needs_workflow_backup = workflow_snapshot_enabled and not workflow_backup.exists()
          if not candidates and not needs_workflow_backup:
              print("No plaintext tracked app files or new enabled workflow snapshot need encryption.")
              raise SystemExit(0)

          public_key_text = os.environ.get("BACKUP_RECIPIENT_PUBLIC_KEY", "")
          public_keys = sorted((workspace / ".github" / "backup-recipients").glob("*.pem"))
          if not public_key_text and not public_keys:
              raise SystemExit(
                  "Pages deployed, but source remains plaintext: configure BACKUP_RECIPIENT_PUBLIC_KEY "
                  "or add recipient PEM files under .github/backup-recipients/."
              )
          if not os.environ.get("BACKUP_DECRYPT_PRIVATE_KEY", ""):
              raise SystemExit(
                  "Pages deployed, but source remains plaintext: configure BACKUP_DECRYPT_PRIVATE_KEY "
                  "as a repository secret."
              )

          work = Path(tempfile.mkdtemp(prefix="fw-pages-encrypt-", dir=temp_root))
          os.chmod(work, 0o700)
          staged = work / "staged"
          staged.mkdir(mode=0o700)
          private_key = work / "private.pem"
          passphrase_file = work / "passphrase.txt"
          private_key.write_text(os.environ["BACKUP_DECRYPT_PRIVATE_KEY"], encoding="utf-8")
          passphrase_file.write_text(os.environ.get("BACKUP_DECRYPT_PASSPHRASE", "").rstrip("\r\n"), encoding="utf-8")
          os.chmod(private_key, 0o600)
          os.chmod(passphrase_file, 0o600)
          try:
              public_args = []
              if public_key_text:
                  configured = work / "configured-recipient.pem"
                  configured.write_text(public_key_text, encoding="utf-8")
                  os.chmod(configured, 0o600)
                  public_keys.append(configured)
              for public_key in public_keys:
                  public_args.extend(["--public-key", str(public_key)])

              # Prove the configured decrypt key is a recipient before touching tracked files.
              check_plain = work / "key-check.txt"
              check_cipher = work / "key-check.fwenc"
              check_plain.write_text("FERROWORKS FWENC004 key check\n", encoding="utf-8")
              subprocess.run([
                  sys.executable, str(helper), "encrypt", "--input", str(check_plain),
                  "--output", str(check_cipher), *public_args,
              ], check=True)
              subprocess.run([
                  sys.executable, str(helper), "decrypt", "--private-key", str(private_key),
                  "--passphrase-file", str(passphrase_file), "--input", str(check_cipher),
                  "--output", str(work / "key-check-decrypted.txt"),
              ], check=True)

              for rel, target, source in candidates:
                  staged_path = staged / rel.relative_to(site_rel)
                  staged_path.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                  subprocess.run([
                      sys.executable, str(helper), "encrypt", "--input", str(source),
                      "--output", str(staged_path), *public_args,
                  ], check=True)
                  os.chmod(staged_path, stat.S_IMODE(target.stat().st_mode))

              # Preserve an encrypted, authenticated snapshot of this workflow on every workflow revision.
              if needs_workflow_backup:
                  staged_workflow = staged / "workflow-snapshot.fwenc"
                  subprocess.run([
                      sys.executable, str(helper), "encrypt", "--input", str(workflow_source),
                      "--output", str(staged_workflow), *public_args,
                  ], check=True)
                  os.chmod(staged_workflow, 0o600)

              # Only start replacing tracked sources after every output encrypted successfully.
              for rel, target, _source in candidates:
                  os.replace(staged / rel.relative_to(site_rel), target)
                  subprocess.run(
                      ["git", "add", "--", ":(literal)" + rel.as_posix()],
                      cwd=workspace, check=True,
                  )
              if needs_workflow_backup:
                  workflow_backup.parent.mkdir(parents=True, exist_ok=True)
                  os.replace(staged / "workflow-snapshot.fwenc", workflow_backup)
                  subprocess.run(
                      ["git", "add", "--", ":(literal)" + workflow_backup.relative_to(workspace).as_posix()],
                      cwd=workspace, check=True,
                  )
          finally:
              for path in sorted(work.rglob("*"), reverse=True):
                  if path.is_file() or path.is_symlink():
                      path.unlink(missing_ok=True)
                  elif path.is_dir():
                      path.rmdir()
              work.rmdir()

          print(f"Encrypted {len(candidates)} tracked app file(s) after deployment.")
          PYENCRYPT

          if ! git diff --cached --quiet -- artifacts/production .github/encrypted-backups; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[FERROWORKS] Encrypt Pages source after deploy [skip ci]"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          else
            echo "No plaintext Pages source files needed encryption."
          fi
