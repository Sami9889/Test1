# Custom workflow plumbing; cryptographic primitives come from GnuPG/OpenPGP.
# Project attribution: Copyright © 2025 FERROWORKS. Project lead: Samrath "Sami" Singh (Sami-s.dev).
# Configure one repository variable GPG_PUBLIC_KEY (one ASCII-armored public key).
# Keep its matching private decrypt key offline; authorized users can each hold a copy.
# Everyone with that private key can decrypt every backup; rotate it to revoke access.
# Checks detect corruption and provide public-repo provenance; they cannot prevent
# a privileged account from deleting or replacing a backup.
#
# Offline restore after downloading both artifact files:
#   sha256sum --check ferroworks-<commit>.backup.tar.gpg.sha256
#   gpg --output ferroworks-backup.tar --decrypt ferroworks-<commit>.backup.tar.gpg
#   mkdir restore-files && tar -xf ferroworks-backup.tar -C restore-files
#   (cd restore-files && sha256sum --check package.sha256)
#   git clone ./restore-files/repository.bundle restored-repository
# Public-repository provenance check (this workflow attests public repositories only):
#   gh attestation verify ferroworks-<commit>.backup.tar.gpg -R owner/repository
name: FERROWORKS security and encrypted recovery

on:
  push:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run the secret scan
        type: boolean
        required: true
        default: true
      create_encrypted_backup:
        description: Create and upload an encrypted Git backup
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  # Runs only on the trusted default branch; this workflow intentionally has no PR trigger.
  secret-scan:
    name: Scan Git history for secrets
    if: >-
      ${{
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        (github.event_name != 'workflow_dispatch' || inputs.run_checks)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep scan reports out of separate, unencrypted workflow artifacts.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

  encrypted-backup:
    name: Create encrypted and verified Git backup
    if: >-
      ${{
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        (github.event_name != 'workflow_dispatch' || inputs.create_encrypted_backup)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test GnuPG AES-256 encryption and decryption
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test_dir="$RUNNER_TEMP/gpg-self-test"
          mkdir -m 0700 "$test_dir"
          trap 'rm -rf -- "$test_dir"' EXIT

          command -v gpg
          gpg --version | head -n 1
          openssl rand -hex 32 > "$test_dir/passphrase"
          printf '%s\n' "GnuPG workflow self-test" > "$test_dir/plaintext"
          gpg --homedir "$test_dir" --batch --yes --no-tty \
            --pinentry-mode loopback --passphrase-file "$test_dir/passphrase" \
            --symmetric --cipher-algo AES256 \
            --output "$test_dir/ciphertext.gpg" "$test_dir/plaintext"
          gpg --homedir "$test_dir" --batch --yes --no-tty \
            --pinentry-mode loopback --passphrase-file "$test_dir/passphrase" \
            --output "$test_dir/restored" --decrypt "$test_dir/ciphertext.gpg"
          cmp --silent "$test_dir/plaintext" "$test_dir/restored"

      - name: Import and verify the OpenPGP recipient
        shell: bash
        env:
          GPG_PUBLIC_KEY: ${{ vars.GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${GPG_PUBLIC_KEY:-}" ]]; then
            echo "::error title=Encryption is not configured::Set the repository variable GPG_PUBLIC_KEY."
            exit 1
          fi

          gpg_home="$RUNNER_TEMP/gnupg"
          public_key="$RUNNER_TEMP/ferroworks-recipient.asc"
          mkdir -m 0700 "$gpg_home"
          export GNUPGHOME="$gpg_home"
          printf '%s\n' "$GPG_PUBLIC_KEY" > "$public_key"
          gpg --batch --no-tty --import "$public_key"

          primary_key_count="$(gpg --batch --with-colons --show-keys "$public_key" |
            awk -F: '$1 == "pub" { count++ } END { print count+0 }')"
          if [[ "$primary_key_count" != "1" ]]; then
            echo "::error title=Expected one OpenPGP key::GPG_PUBLIC_KEY must contain exactly one primary public key."
            exit 1
          fi
          actual="$(gpg --batch --with-colons --show-keys "$public_key" |
            awk -F: '$1 == "fpr" && !found { print toupper($10); found=1 }')"
          if [[ ! "$actual" =~ ^([0-9A-F]{40}|[0-9A-F]{64})$ ]]; then
            echo "::error title=Invalid OpenPGP key::Could not derive the full primary-key fingerprint."
            exit 1
          fi
          if ! gpg --batch --with-colons --list-keys "$actual" |
            awk -F: '($1 == "pub" || $1 == "sub") && $12 ~ /e/ { found=1 } END { exit !found }'; then
            echo "::error title=Recipient cannot encrypt::The selected OpenPGP key has no encryption-capable key."
            exit 1
          fi

          rm -f -- "$public_key"
          echo "GNUPGHOME=$gpg_home" >> "$GITHUB_ENV"
          echo "GPG_RECIPIENT_FINGERPRINT=$actual" >> "$GITHUB_ENV"

      - name: Create and verify Git bundle
        shell: bash
        run: |
          set -euo pipefail
          # A Git bundle captures history and refs, not Git LFS payload objects.
          bundle="$RUNNER_TEMP/ferroworks-${GITHUB_SHA}.bundle"
          git bundle create "$bundle" --all
          git bundle verify "$bundle"
          echo "BUNDLE_PATH=$bundle" >> "$GITHUB_ENV"

      - name: Add copyright notice and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          bundle="${BUNDLE_PATH:?Git bundle path is missing}"
          package_dir="$RUNNER_TEMP/ferroworks-package"
          verify_dir="$RUNNER_TEMP/ferroworks-package-verify"
          payload="$RUNNER_TEMP/ferroworks-${GITHUB_SHA}.backup.tar"
          mkdir -m 0700 "$package_dir" "$verify_dir"
          trap 'rm -f -- "$bundle"; rm -rf -- "$package_dir" "$verify_dir"' EXIT

          cp -- "$bundle" "$package_dir/repository.bundle"
          cat > "$package_dir/COPYRIGHT.txt" <<'NOTICE'
          Copyright © 2025 FERROWORKS.
          Project lead: Samrath "Sami" Singh (Sami-s.dev), Full-Stack Developer & Software Engineer.
          Site: https://sami-s.dev
          Do not alter, remove, or misrepresent this notice or the integrity manifest.
          Unauthorized tampering may violate applicable license terms or law.
          This notice does not replace or modify any license or notice in the backed-up repository.
          NOTICE
          grep -Fqx 'Copyright © 2025 FERROWORKS.' \
            "$package_dir/COPYRIGHT.txt"
          grep -Fq 'Project lead: Samrath "Sami" Singh (Sami-s.dev)' \
            "$package_dir/COPYRIGHT.txt"
          grep -Fq 'Do not alter, remove, or misrepresent this notice' \
            "$package_dir/COPYRIGHT.txt"

          bundle_digest="$(sha256sum "$package_dir/repository.bundle" | awk '{print $1}')"
          {
            echo "FERROWORKS encrypted Git backup"
            echo "copyright=Copyright © 2025 FERROWORKS."
            echo "project_lead=Samrath Sami Singh (Sami-s.dev)"
            echo "project_site=https://sami-s.dev"
            echo "notice=Do not alter, remove, or misrepresent this notice or the integrity manifest."
            echo "commit=$GITHUB_SHA"
            echo "created_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "git_bundle_sha256=$bundle_digest"
            echo "integrity=package SHA-256 plus OpenPGP encrypted-data integrity"
          } > "$package_dir/MANIFEST.txt"

          (
            cd "$package_dir"
            sha256sum COPYRIGHT.txt MANIFEST.txt repository.bundle > package.sha256
            sha256sum --check package.sha256
          )
          tar --create --file="$payload" --directory="$package_dir" \
            --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner --format=posix .
          tar --list --file="$payload" >/dev/null
          tar --extract --file="$payload" --directory="$verify_dir"
          (cd "$verify_dir" && sha256sum --check package.sha256)
          echo "PAYLOAD_PATH=$payload" >> "$GITHUB_ENV"

      - name: Encrypt backup before upload
        shell: bash
        run: |
          set -euo pipefail
          payload="${PAYLOAD_PATH:?Backup package path is missing}"
          bundle="${BUNDLE_PATH:?Git bundle path is missing}"
          trap 'rm -f -- "$payload" "$bundle"' EXIT
          if [[ -z "${GPG_RECIPIENT_FINGERPRINT:-}" || ! -d "${GNUPGHOME:-}" ]]; then
            echo "::error title=OpenPGP recipient is unavailable::The recipient import step did not complete."
            exit 1
          fi

          encrypted="${payload}.gpg"
          gpg --homedir "$GNUPGHOME" --batch --yes --no-tty \
            --trust-model always --recipient "$GPG_RECIPIENT_FINGERPRINT" \
            --cipher-algo AES256 --set-filename "ferroworks-backup.tar" \
            --output "$encrypted" --encrypt "$payload"
          test -s "$encrypted"
          gpg --homedir "$GNUPGHOME" --batch --list-packets "$encrypted" >/dev/null
          rm -f -- "$payload" "$bundle"
          checksum_file="${encrypted}.sha256"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$encrypted")" > "$(basename "$checksum_file")"
            sha256sum --check "$(basename "$checksum_file")"
          )

          digest="$(sha256sum "$encrypted" | awk '{print $1}')"
          {
            echo "### Encrypted OpenPGP Git backup"
            echo
            echo "- Ciphertext: \`$(basename "$encrypted")\`"
            echo "- SHA-256: \`$digest\`"
            echo "- Copyright notice and package manifest are inside the encrypted package."
            echo "- Plaintext bundle and package removed before upload."
          } >> "$GITHUB_STEP_SUMMARY"

      # Public repositories get a Sigstore-backed provenance attestation for the ciphertext.
      - name: Attest encrypted backup provenance
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/ferroworks-${{ github.sha }}.backup.tar.gpg

      - name: Upload encrypted backup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferroworks-openpgp-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ferroworks-${{ github.sha }}.backup.tar.gpg
            ${{ runner.temp }}/ferroworks-${{ github.sha }}.backup.tar.gpg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
