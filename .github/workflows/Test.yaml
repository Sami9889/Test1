 FERROWORKS encrypted Git recovery workflow.
# Copyright © 2025 FERROWORKS. Project lead: Samrath "Sami" Singh.
# This workflow intentionally has no pull_request trigger.
# Manual dispatch encrypts the exact commit SHA for the branch/ref selected in
# GitHub Actions. Push and scheduled runs remain limited to the default branch.
#
# ONE-FILE SETUP:
# 1. Add this YAML file at .github/workflows/ferroworks-encrypted-recovery.yml.
# 2. Generate an RSA key pair offline:
#      openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -aes-256-cbc -out backup-private.pem
#      openssl pkey -in backup-private.pem -pubout -out backup-public.pem
# 3. Add one public PEM per teammate under .github/backup-recipients/*.pem.
#    Public keys may be committed; never add private keys to GitHub.
#    The BACKUP_RECIPIENT_PUBLIC_KEY repository variable/secret remains
#    supported as an additional recipient for compatibility.
# 4. Protect changes to .github/backup-recipients with branch protection and
#    required review. Removing a key affects future backups only; it cannot
#    revoke artifacts already downloaded or encrypted for that key.
# 5. This design commits ciphertext to the source branch as requested. Later
#    full-history bundles therefore contain earlier encrypted-backup commits.
#    The workflow requires GitHub Actions to have contents:write permission;
#    protected branches may require a pull-request-based publishing strategy.
#
# OFFLINE RESTORE:
# Save this YAML file separately. Extract its embedded helper with:
#   awk '/^          # BEGIN_HYBRID_HELPER$/{inside=1;next} /^          # END_HYBRID_HELPER$/{inside=0;exit} inside{sub(/^          /,"");print}' \
#     .github/workflows/ferroworks-encrypted-recovery.yml > ferroworks_hybrid_encrypt.py
# Then verify and decrypt the downloaded artifact:
#   sha256sum --check ferroworks-<commit>.backup.fwenc.sha256
#   python3 ferroworks_hybrid_encrypt.py decrypt --private-key backup-private.pem \
#     --input ferroworks-<commit>.backup.fwenc --output ferroworks-backup.tar
#   mkdir restore-files
#   tar -xf ferroworks-backup.tar -C restore-files
#   (cd restore-files && sha256sum --check package.sha256)
#   git clone restore-files/repository.bundle restored-repository
#
# Envelope: RSA-OAEP-SHA256 key wrap + AES-256-CBC + HMAC-SHA256.
# The recipient list has no configured count cap; practical runner and artifact
# storage limits still apply.
# The workflow uses GitHub's official checkout and branch write permission, but no
# OpenPGP, third-party encryption API, secret-scanning service, or attestation.

name: FERROWORKS encrypted recovery

on:
  push:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encrypted-backup:
    name: Encrypt selected commit and commit backup
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')) ||
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Build and encrypt backup
        shell: bash
        env:
          BACKUP_RECIPIENT_PUBLIC_KEY: ${{ vars.BACKUP_RECIPIENT_PUBLIC_KEY || secrets.BACKUP_RECIPIENT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077

          work_dir="$RUNNER_TEMP/ferroworks-work-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_dir="$RUNNER_TEMP/ferroworks-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          public_key="$RUNNER_TEMP/ferroworks-recipient-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.pem"
          mkdir -m 0700 "$work_dir" "$artifact_dir"
          trap 'rm -rf -- "$work_dir" "$artifact_dir"; rm -f -- "$public_key"' EXIT

          recipient_keys=()
          recipient_args=()
          shopt -s nullglob
          for key in "$GITHUB_WORKSPACE"/.github/backup-recipients/*.pem; do
            recipient_keys+=("$key")
          done
          if [[ -n "${BACKUP_RECIPIENT_PUBLIC_KEY:-}" ]]; then
            printf '%s\n' "$BACKUP_RECIPIENT_PUBLIC_KEY" > "$public_key"
            chmod 0600 "$public_key"
            recipient_keys+=("$public_key")
          fi
          if (( ${#recipient_keys[@]} == 0 )); then
            echo "::error title=Recipients not configured::Add PEM RSA public keys under .github/backup-recipients/ or set BACKUP_RECIPIENT_PUBLIC_KEY."
            exit 1
          fi
          for key in "${recipient_keys[@]}"; do
            recipient_args+=(--public-key "$key")
          done

          bundle="$work_dir/repository.bundle"
          package_dir="$work_dir/package"
          payload="$work_dir/ferroworks-${GITHUB_SHA}.backup.tar"
          encrypted="$artifact_dir/ferroworks-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.backup.fwenc"
          mkdir -m 0700 "$package_dir"

          git bundle create "$bundle" --all HEAD
          git bundle verify "$bundle"
          cp -- "$bundle" "$package_dir/repository.bundle"

          cat > "$package_dir/COPYRIGHT.txt" <<'NOTICE'
          Copyright © 2025 FERROWORKS.
          Project lead: Samrath "Sami" Singh (Sami-s.dev), Full-Stack Developer & Software Engineer.
          Site: https://sami-s.dev
          Do not alter, remove, or misrepresent this notice or the integrity manifest.
          Unauthorized tampering may violate applicable license terms or law.
          This notice does not replace or modify any license or notice in the backed-up repository.
          NOTICE

          bundle_digest="$(sha256sum "$package_dir/repository.bundle" | awk '{print $1}')"
          {
            echo "FERROWORKS encrypted Git backup"
            echo "copyright=Copyright © 2025 FERROWORKS."
            echo "project_lead=Samrath Sami Singh (Sami-s.dev)"
            echo "branch=$GITHUB_REF_NAME"
            echo "ref=$GITHUB_REF"
            echo "commit=$GITHUB_SHA"
            echo "trigger=$GITHUB_EVENT_NAME"
            echo "actor=$GITHUB_ACTOR"
            echo "recipient_key_count=${#recipient_keys[@]}"
            echo "created_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "git_bundle_sha256=$bundle_digest"
            echo "contents=Git refs and HEAD"
            echo "limitations=Does not include uncommitted files, untracked files, or Git LFS payload objects."
            echo "envelope=FWENC003; per-recipient RSA-OAEP-SHA256 key wrapping; AES-256-CBC; HMAC-SHA256"
          } > "$package_dir/MANIFEST.txt"

          (
            cd "$package_dir"
            sha256sum COPYRIGHT.txt MANIFEST.txt repository.bundle > package.sha256
            sha256sum --check package.sha256
          )

          tar --create --file="$payload" --directory="$package_dir" \
            --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner --format=posix .
          tar --list --file="$payload" >/dev/null

          helper="$work_dir/ferroworks_hybrid_encrypt.py"
          cat > "$helper" <<'PYHELPER'
          # BEGIN_HYBRID_HELPER
          #!/usr/bin/env python3
          import argparse
          import hashlib
          import hmac
          import os
          import re
          import shutil
          import struct
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          MAGIC = b"FWENC003"
          VERSION = 3
          ITERATIONS = 600_000
          SALT_BYTES = 16
          MASTER_BYTES = 64
          TAG_BYTES = 32
          HEADER = struct.Struct(">8sBI16sQ")
          RECIPIENT_ID_BYTES = 32
          MAC_LABEL = b"FERROWORKS-FWENC-MAC-v1"

          class Failure(Exception):
              pass

          def openssl():
              path = shutil.which("openssl")
              if not path:
                  raise Failure("OpenSSL was not found.")
              result = subprocess.run([path, "version"], capture_output=True, text=True)
              if result.returncode or not result.stdout.startswith("OpenSSL 3."):
                  raise Failure("OpenSSL 3.x is required.")
              return path

          def checked(args, message):
              result = subprocess.run(args, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              if result.returncode:
                  detail = result.stderr.decode("utf-8", "replace").strip().splitlines()
                  raise Failure(message + (": " + detail[-1] if detail else ""))

          def public_key_id(openssl_path, public_key):
              key_info = subprocess.run(
                  [openssl_path, "rsa", "-pubin", "-in", str(public_key), "-noout", "-text"],
                  stdin=subprocess.DEVNULL, capture_output=True, text=True,
              )
              match = re.search(r"Public-Key:\s*\((\d+)\s+bit\)", key_info.stdout)
              if key_info.returncode or not match or int(match.group(1)) < 2048:
                  raise Failure("Every recipient must be a PEM RSA public key of at least 2048 bits.")
              result = subprocess.run(
                  [openssl_path, "pkey", "-pubin", "-in", str(public_key), "-pubout", "-outform", "DER"],
                  stdin=subprocess.DEVNULL, capture_output=True,
              )
              if result.returncode or not result.stdout:
                  raise Failure("Could not fingerprint a recipient public key.")
              return hashlib.sha256(result.stdout).digest()

          def mac_key(master):
              return hmac.new(master, MAC_LABEL, hashlib.sha256).digest()

          def crypt(openssl_path, decrypt, salt, passfile, source, destination):
              args = [
                  openssl_path, "enc", "-aes-256-cbc", "-pbkdf2", "-iter", str(ITERATIONS),
                  "-md", "sha256", "-S", salt.hex(),
                  "-pass", "file:" + str(passfile), "-in", str(source), "-out", str(destination),
              ]
              if decrypt:
                  args.insert(2, "-d")
              checked(args, "AES encryption/decryption failed")

          def publish(temp_path, output):
              try:
                  os.link(temp_path, output)
              except FileExistsError:
                  raise Failure("Output already exists: " + str(output))
              temp_path.unlink()

          def encrypt(source, public_keys, output):
              openssl_path = openssl()
              source, output = source.resolve(), output.resolve()
              public_keys = [path.resolve() for path in public_keys]
              if not source.is_file() or not public_keys or any(not path.is_file() for path in public_keys):
                  raise Failure("Input file or recipient public key does not exist.")
              output.parent.mkdir(parents=True, exist_ok=True)
              recipients = []
              seen_ids = set()
              for public_key in public_keys:
                  recipient_id = public_key_id(openssl_path, public_key)
                  if recipient_id not in seen_ids:
                      recipients.append((recipient_id, public_key))
                      seen_ids.add(recipient_id)
              if not recipients:
                  raise Failure("At least one distinct recipient key is required.")
              work = Path(tempfile.mkdtemp(prefix="fwenc-"))
              os.chmod(work, 0o700)
              temp_output = None
              try:
                  master = os.urandom(MASTER_BYTES)
                  key_file = work / "master.key"
                  key_file.write_bytes(master)
                  os.chmod(key_file, 0o600)
                  records = []
                  for index, (recipient_id, public_key) in enumerate(recipients):
                      wrapped_file = work / ("wrapped-" + str(index) + ".key")
                      checked([
                          openssl_path, "pkeyutl", "-encrypt", "-pubin", "-inkey", str(public_key),
                          "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256",
                          "-pkeyopt", "rsa_mgf1_md:sha256", "-in", str(key_file), "-out", str(wrapped_file),
                      ], "RSA-OAEP key wrapping failed")
                      wrapped = wrapped_file.read_bytes()
                      if not wrapped or len(wrapped) > 65535:
                          raise Failure("Invalid wrapped-key size.")
                      records.append(recipient_id + struct.pack(">H", len(wrapped)) + wrapped)
                  salt = os.urandom(SALT_BYTES)
                  header = HEADER.pack(MAGIC, VERSION, ITERATIONS, salt, len(records)) + b"".join(records)
                  passfile = work / "passphrase.txt"
                  passfile.write_text(master.hex() + "\n", encoding="ascii")
                  os.chmod(passfile, 0o600)
                  ciphertext = work / "ciphertext.bin"
                  crypt(openssl_path, False, salt, passfile, source, ciphertext)
                  mac = hmac.new(mac_key(master), digestmod=hashlib.sha256)
                  mac.update(header)
                  with ciphertext.open("rb") as stream:
                      for block in iter(lambda: stream.read(1024 * 1024), b""):
                          mac.update(block)
                  with tempfile.NamedTemporaryFile(prefix=".fwenc-", dir=output.parent, delete=False) as out:
                      temp_output = Path(out.name)
                      os.chmod(temp_output, 0o600)
                      out.write(header)
                      with ciphertext.open("rb") as stream:
                          shutil.copyfileobj(stream, out, 1024 * 1024)
                      out.write(mac.digest())
                      out.flush()
                      os.fsync(out.fileno())
                  publish(temp_output, output)
                  temp_output = None
                  print("Recipient key fingerprints: " + ", ".join(rid.hex() for rid, _ in recipients))
                  print(output)
              finally:
                  if temp_output:
                      temp_output.unlink(missing_ok=True)
                  shutil.rmtree(work, ignore_errors=True)

          def decrypt(source, private_key, output):
              openssl_path = openssl()
              source, private_key, output = source.resolve(), private_key.resolve(), output.resolve()
              if not source.is_file() or not private_key.is_file():
                  raise Failure("Encrypted input or private key does not exist.")
              if output.exists():
                  raise Failure("Output already exists: " + str(output))
              output.parent.mkdir(parents=True, exist_ok=True)
              work = Path(tempfile.mkdtemp(prefix="fwdec-"))
              os.chmod(work, 0o700)
              temp_output = None
              try:
                  import getpass
                  size = source.stat().st_size
                  passphrase = getpass.getpass("Private key passphrase: ")
                  if "\n" in passphrase or "\r" in passphrase or "\x00" in passphrase:
                      raise Failure("Private-key passphrase contains an unsupported character.")
                  passfile = work / "private-key.pass"
                  passfile.write_text(passphrase + "\n", encoding="utf-8")
                  os.chmod(passfile, 0o600)
                  private_der = subprocess.run(
                      [openssl_path, "pkey", "-in", str(private_key), "-pubout", "-outform", "DER",
                       "-passin", "file:" + str(passfile)],
                      stdin=subprocess.DEVNULL, capture_output=True,
                  )
                  if private_der.returncode or not private_der.stdout:
                      raise Failure("Could not read the private key or its passphrase.")
                  recipient_id = hashlib.sha256(private_der.stdout).digest()
                  with source.open("rb") as stream:
                      prefix = stream.read(HEADER.size)
                      if len(prefix) != HEADER.size:
                          raise Failure("Invalid FWENC file.")
                      magic, version, iterations, salt, recipient_count = HEADER.unpack(prefix)
                      max_recipient_count = (size - HEADER.size - TAG_BYTES) // (RECIPIENT_ID_BYTES + 2 + 256)
                      if (magic != MAGIC or version != VERSION or iterations != ITERATIONS
                              or recipient_count < 1 or recipient_count > max_recipient_count):
                          raise Failure("Unsupported or invalid FWENC format.")
                      records = []
                      record_bytes = bytearray()
                      for _ in range(recipient_count):
                          rid = stream.read(RECIPIENT_ID_BYTES)
                          wrapped_length_bytes = stream.read(2)
                          if len(rid) != RECIPIENT_ID_BYTES or len(wrapped_length_bytes) != 2:
                              raise Failure("Truncated recipient list.")
                          wrapped_len = struct.unpack(">H", wrapped_length_bytes)[0]
                          if wrapped_len < 256:
                              raise Failure("Invalid wrapped-key length.")
                          wrapped = stream.read(wrapped_len)
                          if len(wrapped) != wrapped_len:
                              raise Failure("Truncated wrapped key.")
                          record_bytes.extend(rid + wrapped_length_bytes + wrapped)
                          records.append((rid, wrapped))
                      header = prefix + bytes(record_bytes)
                      wrapped = next((blob for rid, blob in records if rid == recipient_id), None)
                      if wrapped is None:
                          raise Failure("This private key is not an authorized backup recipient.")
                      cipher_len = size - len(header) - TAG_BYTES
                      if cipher_len < 16 or cipher_len % 16:
                          raise Failure("Invalid or truncated ciphertext.")
                      cipher = work / "ciphertext.bin"
                      with cipher.open("xb") as out:
                          remaining = cipher_len
                          while remaining:
                              block = stream.read(min(1024 * 1024, remaining))
                              if not block:
                                  raise Failure("Truncated ciphertext.")
                              out.write(block)
                              remaining -= len(block)
                      tag = stream.read(TAG_BYTES)
                      if len(tag) != TAG_BYTES or stream.read(1):
                          raise Failure("Invalid authentication tag or trailing data.")
                  wrapped_file = work / "wrapped.key"
                  wrapped_file.write_bytes(wrapped)
                  key_file = work / "master.key"
                  result = subprocess.run([
                      openssl_path, "pkeyutl", "-decrypt", "-inkey", str(private_key),
                      "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256",
                      "-pkeyopt", "rsa_mgf1_md:sha256", "-passin", "file:" + str(passfile),
                      "-in", str(wrapped_file), "-out", str(key_file),
                  ])
                  if result.returncode or not key_file.is_file():
                      raise Failure("Could not unwrap the backup key.")
                  master = key_file.read_bytes()
                  if len(master) != MASTER_BYTES:
                      raise Failure("Invalid unwrapped key.")
                  mac = hmac.new(mac_key(master), digestmod=hashlib.sha256)
                  mac.update(header)
                  with cipher.open("rb") as stream:
                      for block in iter(lambda: stream.read(1024 * 1024), b""):
                          mac.update(block)
                  if not hmac.compare_digest(mac.digest(), tag):
                      raise Failure("Authentication failed: damaged backup or wrong private key.")
                  passfile = work / "passphrase.txt"
                  passfile.write_text(master.hex() + "\n", encoding="ascii")
                  payload = work / "decrypted.tar"
                  crypt(openssl_path, True, salt, passfile, cipher, payload)
                  with tempfile.NamedTemporaryFile(prefix=".fwplain-", dir=output.parent, delete=False) as out:
                      temp_output = Path(out.name)
                      os.chmod(temp_output, 0o600)
                      with payload.open("rb") as stream:
                          shutil.copyfileobj(stream, out, 1024 * 1024)
                      out.flush()
                      os.fsync(out.fileno())
                  publish(temp_output, output)
                  temp_output = None
                  print(output)
              finally:
                  if temp_output:
                      temp_output.unlink(missing_ok=True)
                  shutil.rmtree(work, ignore_errors=True)

          def main():
              parser = argparse.ArgumentParser()
              sub = parser.add_subparsers(dest="mode", required=True)
              enc = sub.add_parser("encrypt")
              enc.add_argument("--public-key", type=Path, action="append", required=True)
              enc.add_argument("--input", type=Path, required=True)
              enc.add_argument("--output", type=Path, required=True)
              dec = sub.add_parser("decrypt")
              dec.add_argument("--private-key", type=Path, required=True)
              dec.add_argument("--input", type=Path, required=True)
              dec.add_argument("--output", type=Path, required=True)
              args = parser.parse_args()
              try:
                  if args.mode == "encrypt":
                      encrypt(args.input, args.public_key, args.output)
                  else:
                      decrypt(args.input, args.private_key, args.output)
              except (Failure, OSError) as exc:
                  print("error: " + str(exc), file=sys.stderr)
                  raise SystemExit(1)

          if __name__ == "__main__":
              main()
          # END_HYBRID_HELPER
          PYHELPER
          chmod 0700 "$helper"

          python3 "$helper" encrypt \
            --input "$payload" \
            --output "$encrypted" \
            "${recipient_args[@]}" | tee "$work_dir/encryption-report.txt"

          {
            echo "### Encrypted Git backup"
            echo "- Branch/ref: $GITHUB_REF"
            echo "- Commit: $GITHUB_SHA"
            echo "- Triggered by: $GITHUB_ACTOR"
            echo "- Recipient keys configured: ${#recipient_keys[@]}"
            grep '^Recipient key fingerprints:' "$work_dir/encryption-report.txt"
          } >> "$GITHUB_STEP_SUMMARY"

          (
            cd "$artifact_dir"
            sha256sum "$(basename "$encrypted")" > "$(basename "$encrypted").sha256"
            sha256sum --check "$(basename "$encrypted").sha256"
          )

          backup_dir="$GITHUB_WORKSPACE/.github/encrypted-backups"
          mkdir -p "$backup_dir"
          cp -- "$encrypted" "$backup_dir/"
          cp -- "$encrypted.sha256" "$backup_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ".github/encrypted-backups/$(basename "$encrypted")" ".github/encrypted-backups/$(basename "$encrypted").sha256"
          git commit -m "[encrypted-backup] ${GITHUB_REF_NAME} ${GITHUB_SHA} [skip ci]"
          git push origin "HEAD:${GITHUB_REF}"
          echo "Encrypted backup committed to ${GITHUB_REF} at .github/encrypted-backups/."

          rm -rf -- "$work_dir"
          rm -rf -- "$artifact_dir"
          rm -f -- "$public_key"

