name: FERROWORKS Pages decrypt and deploy

on:
  workflow_run:
    workflows:
      - FERROWORKS encrypted recovery
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ferroworks-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Decrypt, build, deploy, then encrypt source
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
         github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch)
      }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Calculate the Vite base path
        id: pages-path
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [[ "${repository,,}" == "${owner,,}.github.io" ]]; then
            base_path="/"
          else
            base_path="/${repository}/"
          fi
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"

      - name: Make a temporary build copy and decrypt encrypted app files
        shell: bash
        env:
          BACKUP_DECRYPT_PRIVATE_KEY: ${{ secrets.BACKUP_DECRYPT_PRIVATE_KEY }}
          BACKUP_DECRYPT_PASSPHRASE: ${{ secrets.BACKUP_DECRYPT_PASSPHRASE }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/ferroworks_hybrid_encrypt.py"
          source_copy="$RUNNER_TEMP/ferroworks-pages-source"

          awk '/^          # BEGIN_HYBRID_HELPER$/{inside=1;next} /^          # END_HYBRID_HELPER$/{inside=0;exit} inside{sub(/^          /,"");print}' \
            .github/workflows/ferroworks-encrypted-recovery.yml > "$helper"
          chmod 0700 "$helper"

          rm -rf -- "$source_copy"
          mkdir -m 0700 "$source_copy"
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='**/node_modules/' \
            --exclude='dist/' \
            --exclude='**/dist/' \
            --exclude='.cache/' \
            --exclude='attached_assets/' \
            --exclude='.github/encrypted-backups/' \
            "$GITHUB_WORKSPACE/" "$source_copy/"

          echo "PAGES_SOURCE_COPY=$source_copy" >> "$GITHUB_ENV"
          echo "FWENC_HELPER=$helper" >> "$GITHUB_ENV"

          python3 - "$source_copy" "$helper" <<'PYDECRYPT'
          import os
          import stat
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path(sys.argv[1])
          helper = Path(sys.argv[2])
          app = root / "artifacts" / "mockup-sandbox"
          encrypted_files = []
          for path in app.rglob("*"):
              if path.is_file() and not path.is_symlink():
                  with path.open("rb") as stream:
                      if stream.read(8) == b"FWENC003":
                          encrypted_files.append(path)

          if not encrypted_files:
              print("No encrypted mockup app files found; using the checked-out source.")
              raise SystemExit(0)

          private_key_text = os.environ.get("BACKUP_DECRYPT_PRIVATE_KEY", "")
          if not private_key_text:
              raise SystemExit(
                  "Encrypted Pages source exists. Add BACKUP_DECRYPT_PRIVATE_KEY as a repository secret."
              )

          work = Path(tempfile.mkdtemp(prefix="fw-pages-decrypt-", dir=os.environ["RUNNER_TEMP"]))
          os.chmod(work, 0o700)
          private_key = work / "private.pem"
          passphrase_file = work / "passphrase.txt"
          private_key.write_text(private_key_text, encoding="utf-8")
          passphrase_file.write_text(
              os.environ.get("BACKUP_DECRYPT_PASSPHRASE", "").rstrip("\n") + "\n",
              encoding="utf-8",
          )
          os.chmod(private_key, 0o600)
          os.chmod(passphrase_file, 0o600)

          try:
              for encrypted in encrypted_files:
                  fd, temporary_name = tempfile.mkstemp(
                      prefix=".fwplain-", dir=encrypted.parent
                  )
                  os.close(fd)
                  temporary = Path(temporary_name)
                  temporary.unlink()
                  try:
                      subprocess.run(
                          [
                              sys.executable, str(helper), "decrypt",
                              "--private-key", str(private_key),
                              "--passphrase-file", str(passphrase_file),
                              "--input", str(encrypted),
                              "--output", str(temporary),
                          ],
                          check=True,
                      )
                      os.chmod(temporary, stat.S_IMODE(encrypted.stat().st_mode))
                      os.replace(temporary, encrypted)
                  finally:
                      temporary.unlink(missing_ok=True)
          finally:
              for child in work.iterdir():
                  child.unlink(missing_ok=True)
              work.rmdir()

          print(f"Decrypted {len(encrypted_files)} app file(s) in the temporary build copy.")
          PYDECRYPT

      - name: Add copyright notices to comment-capable app files
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PAGES_SOURCE_COPY/artifacts/mockup-sandbox" <<'PYCOPYRIGHT'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          marker = "Copyright © 2025 FERROWORKS."
          block = """/*!
           * Copyright © 2025 FERROWORKS.
           * Do not alter, remove, or misrepresent this notice or the integrity manifest.
           * Unauthorized tampering may violate applicable license terms or law.
           * Third-party materials retain their respective copyrights and licenses.
           */
          """
          html = """<!--
          Copyright © 2025 FERROWORKS.
          Do not alter, remove, or misrepresent this notice or the integrity manifest.
          Unauthorized tampering may violate applicable license terms or law.
          Third-party materials retain their respective copyrights and licenses.
          -->
          """
          hash_comment = """# Copyright © 2025 FERROWORKS.
          # Do not alter, remove, or misrepresent this notice or the integrity manifest.
          # Unauthorized tampering may violate applicable license terms or law.
          # Third-party materials retain their respective copyrights and licenses.
          """

          for path in root.rglob("*"):
              if not path.is_file() or path.is_symlink():
                  continue
              suffix = path.suffix.lower()
              if suffix in {".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".css"}:
                  text = path.read_text(encoding="utf-8")
                  if marker not in text[:1024]:
                      path.write_text(block + text, encoding="utf-8")
              elif suffix == ".html":
                  text = path.read_text(encoding="utf-8")
                  if marker not in text[:1024]:
                      match = re.search(r"<!doctype\s+html[^>]*>", text, flags=re.IGNORECASE)
                      if match:
                          text = text[:match.end()] + "\n" + html + text[match.end():]
                      else:
                          text = html + text
                      path.write_text(text, encoding="utf-8")
              elif suffix in {".yaml", ".yml", ".toml", ".sh"}:
                  text = path.read_text(encoding="utf-8")
                  if marker not in text[:1024]:
                      if suffix == ".sh" and text.startswith("#!"):
                          first_line, rest = text.split("\n", 1)
                          text = first_line + "\n" + hash_comment + rest
                      else:
                          text = hash_comment + text
                      path.write_text(text, encoding="utf-8")

          print("Added notices where the file format supports comments.")
          PYCOPYRIGHT

      - name: Install workspace dependencies
        working-directory: ${{ runner.temp }}/ferroworks-pages-source
        run: pnpm install --frozen-lockfile

      - name: Build the Vite site
        working-directory: ${{ runner.temp }}/ferroworks-pages-source
        env:
          PORT: "8081"
          BASE_PATH: ${{ steps.pages-path.outputs.base_path }}
        run: pnpm --filter @workspace/mockup-sandbox run build

      - name: Add Pages fallback, copyright notice, and file integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          dist="$PAGES_SOURCE_COPY/artifacts/mockup-sandbox/dist"
          cp -- "$dist/index.html" "$dist/404.html"
          cat > "$dist/COPYRIGHT.txt" <<'COPYRIGHT'
          Copyright © 2025 FERROWORKS.
          Do not alter, remove, or misrepresent this notice or the integrity manifest.
          Unauthorized tampering may violate applicable license terms or law.
          This notice does not replace or modify any license or notice in this repository.
          Third-party materials retain their respective copyrights and licenses.
          COPYRIGHT
          python3 - "$dist" <<'PYMANIFEST'
          import hashlib
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest = root / "COPYRIGHT-MANIFEST.tsv"
          rows = [
              "Copyright © 2025 FERROWORKS.",
              "Do not alter, remove, or misrepresent this notice or the integrity manifest.",
              "Unauthorized tampering may violate applicable license terms or law.",
              "SHA-256\tFILE",
          ]
          files = sorted(path for path in root.rglob("*") if path.is_file() and path != manifest)
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append(f"{digest}\t{path.relative_to(root).as_posix()}")
          manifest.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PYMANIFEST

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/ferroworks-pages-source/artifacts/mockup-sandbox/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Encrypt app source after successful deployment
        shell: bash
        env:
          BACKUP_RECIPIENT_PUBLIC_KEY: ${{ vars.BACKUP_RECIPIENT_PUBLIC_KEY || secrets.BACKUP_RECIPIENT_PUBLIC_KEY }}
          BACKUP_DECRYPT_PRIVATE_KEY: ${{ secrets.BACKUP_DECRYPT_PRIVATE_KEY }}
          BACKUP_DECRYPT_PASSPHRASE: ${{ secrets.BACKUP_DECRYPT_PASSPHRASE }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE" "$PAGES_SOURCE_COPY" "$FWENC_HELPER" <<'PYENCRYPT'
          import os
          import stat
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          workspace = Path(sys.argv[1]).resolve()
          source_copy = Path(sys.argv[2]).resolve()
          helper = Path(sys.argv[3]).resolve()
          site_rel = Path("artifacts/mockup-sandbox")
          site_root = workspace / site_rel
          source_root = source_copy / site_rel

          def should_encrypt(rel):
              parts = rel.parts
              lower = [part.lower() for part in parts]
              if any(part in {"node_modules", "dist"} for part in lower):
                  return False
              if ".replit-artifact" in lower:
                  return False
              if rel.suffix.lower() in {".md", ".markdown"}:
                  return False
              if rel.name.lower().startswith("readme"):
                  return False
              return True

          tracked = subprocess.run(
              ["git", "ls-files", "-z", "--", site_rel.as_posix()],
              cwd=workspace, check=True, capture_output=True,
          ).stdout.split(b"\0")
          candidates = []
          for item in tracked:
              if not item:
                  continue
              rel = Path(os.fsdecode(item))
              if not should_encrypt(rel.relative_to(site_rel)):
                  continue
              target = workspace / rel
              if not target.is_file() or target.is_symlink():
                  continue
              with target.open("rb") as stream:
                  if stream.read(8) == b"FWENC003":
                      continue
              source = source_copy / rel
              if not source.is_file():
                  raise SystemExit(f"Decrypted build copy is missing tracked file: {rel}")
              candidates.append((rel, target, source))

          if not candidates:
              print("All eligible mockup app files are already encrypted.")
              raise SystemExit(0)

          public_keys = sorted((workspace / ".github" / "backup-recipients").glob("*.pem"))
          temporary_dir = Path(tempfile.mkdtemp(prefix="fw-pages-encrypt-", dir=os.environ["RUNNER_TEMP"]))
          os.chmod(temporary_dir, 0o700)
          try:
              configured_public = os.environ.get("BACKUP_RECIPIENT_PUBLIC_KEY", "")
              if configured_public:
                  configured_path = temporary_dir / "configured-recipient.pem"
                  configured_path.write_text(configured_public, encoding="utf-8")
                  os.chmod(configured_path, 0o600)
                  public_keys.append(configured_path)
              if not public_keys:
                  raise SystemExit(
                      "Pages deployed, but source remains plaintext: configure BACKUP_RECIPIENT_PUBLIC_KEY "
                      "or add a public PEM under .github/backup-recipients/."
                  )

              private_key_text = os.environ.get("BACKUP_DECRYPT_PRIVATE_KEY", "")
              if not private_key_text:
                  raise SystemExit(
                      "Pages deployed, but source remains plaintext: add BACKUP_DECRYPT_PRIVATE_KEY "
                      "as a repository secret before enabling source encryption."
                  )
              private_key = temporary_dir / "private.pem"
              passphrase_file = temporary_dir / "passphrase.txt"
              private_key.write_text(private_key_text, encoding="utf-8")
              passphrase_file.write_text(
                  os.environ.get("BACKUP_DECRYPT_PASSPHRASE", "").rstrip("\n") + "\n",
                  encoding="utf-8",
              )
              os.chmod(private_key, 0o600)
              os.chmod(passphrase_file, 0o600)

              public_args = []
              for key in public_keys:
                  public_args.extend(["--public-key", str(key)])

              # Confirm the configured private key can decrypt a new file before
              # replacing any source files in the checked-out branch.
              test_input = temporary_dir / "key-check.txt"
              test_encrypted = temporary_dir / "key-check.fwenc"
              test_input.write_text("FERROWORKS Pages key check\n", encoding="utf-8")
              subprocess.run(
                  [
                      sys.executable, str(helper), "encrypt",
                      "--input", str(test_input), "--output", str(test_encrypted),
                      *public_args,
                  ],
                  check=True,
              )
              subprocess.run(
                  [
                      sys.executable, str(helper), "decrypt",
                      "--private-key", str(private_key),
                      "--passphrase-file", str(passphrase_file),
                      "--input", str(test_encrypted),
                      "--verify-only",
                  ],
                  check=True,
              )

              for rel, target, source in candidates:
                  fd, temporary_name = tempfile.mkstemp(prefix=".fwenc-", dir=target.parent)
                  os.close(fd)
                  temporary = Path(temporary_name)
                  temporary.unlink()
                  try:
                      subprocess.run(
                          [
                              sys.executable, str(helper), "encrypt",
                              "--input", str(source), "--output", str(temporary),
                              *public_args,
                          ],
                          check=True,
                      )
                      os.chmod(temporary, stat.S_IMODE(target.stat().st_mode))
                      os.replace(temporary, target)
                      subprocess.run(
                          ["git", "add", "--", ":(literal)" + rel.as_posix()],
                          cwd=workspace, check=True,
                      )
                  finally:
                      temporary.unlink(missing_ok=True)
          finally:
              for child in temporary_dir.iterdir():
                  child.unlink(missing_ok=True)
              temporary_dir.rmdir()

          print(f"Encrypted {len(candidates)} mockup app file(s) after deployment.")
          PYENCRYPT

          if ! git diff --cached --quiet -- artifacts/mockup-sandbox; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "[FERROWORKS] Encrypt Pages source after deploy [skip ci]"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          else
            echo "No plaintext Pages source files needed encryption."
          fi
